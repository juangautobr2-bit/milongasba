<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Semanal de Milongas CABA | Supabase Cloud</title>
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #fcfcfc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --pill-bg: #f1f5f9;
            --pill-text: #334155;
            --shadow: 0 1px 3px rgba(0,0,0,0.05);
        }

        .dark {
            --bg-main: #0b0d11;
            --bg-card: #151921;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #262d3d;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --pill-bg: #1e2532;
            --pill-text: #cbd5e1;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main) !important;
        }

        .brand i {
            color: var(--accent);
            font-size: 1.25rem;
        }

        .brand h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main) !important;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-icon {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ffffff !important;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }

        .date-banner {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .date-banner h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .date-banner p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .view-switcher {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.75rem;
        }

        .switch-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .switch-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #ffffff !important;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media(min-width: 768px) {
            .controls-section {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .days-pills {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .pill-day {
            background: var(--pill-bg);
            color: var(--pill-text);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .pill-day.active {
            background: var(--accent);
            color: #ffffff !important;
            border-color: var(--accent);
        }

        .filter-pills {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .pill-filter {
            background: var(--pill-bg);
            color: var(--pill-text);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .pill-filter.active {
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .search-bar {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        .search-bar i {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .milongas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .milonga-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .card-title-group h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.15rem;
        }

        .card-salon {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .badge-price {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: var(--pill-bg);
            color: var(--accent);
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-row i {
            width: 16px;
            color: var(--accent);
            text-align: center;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
            margin-top: auto;
        }

        .map-link {
            font-size: 0.78rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .map-link:hover {
            text-decoration: underline;
        }

        .action-btns {
            display: flex;
            gap: 0.4rem;
        }

        .btn-action-sm {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-action-sm:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .flyers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 1.5rem;
        }

        .flyer-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .flyer-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            background: var(--pill-bg);
            overflow: hidden;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .flyer-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .flyer-card:hover .flyer-img-container img {
            transform: scale(1.03);
        }

        .flyer-day-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: var(--accent);
            color: #ffffff !important;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .flyer-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
        }

        .flyer-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .flyer-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .flyer-meta i {
            color: var(--accent);
            width: 14px;
            text-align: center;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .file-upload-box {
            border: 1px dashed var(--accent);
            background: var(--pill-bg);
            padding: 1rem;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .file-upload-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .preview-flyer {
            max-height: 180px;
            border-radius: 6px;
            margin-top: 0.75rem;
            border: 1px solid var(--border-color);
            display: none;
            margin-left: auto;
            margin-right: auto;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(2px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .modal-header h3 {
            font-size: 1rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .btn-secondary {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
        }

        .admin-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
        }

        .tab-btn.active {
            background: var(--accent) !important;
            color: #ffffff !important;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-card);
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="brand" onclick="switchView('public')">
                <i class="fa-solid fa-compact-disc"></i>
                <h1>Cartelera Milonguera CABA</h1>
            </a>
            <div class="nav-actions">
                <button class="btn-icon" id="themeToggle" onclick="toggleTheme()" title="Cambiar Tema">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
                <button class="btn-primary" id="authBtn" onclick="openLoginModal()">
                    <i class="fa-solid fa-user-lock"></i> <span id="authBtnText">Ingresar</span>
                </button>
            </div>
        </div>
    </header>

    <main id="mainContent">
        <!-- VISTA PUBLICA -->
        <div id="publicView">
            <div class="date-banner">
                <h2 id="currentBannerDate">HOY DÍA JUEVES 12 DE NOVIEMBRE DE 2026</h2>
                <p>Agenda semanal de milongas de Buenos Aires &bull; Cartelera y Galería de Flyers</p>
            </div>

            <!-- SELECTOR DE MODO DE VISUALIZACIÓN -->
            <div class="view-switcher">
                <button class="switch-btn active" id="btnModeList" onclick="setPublicDisplayMode('list')">
                    <i class="fa-solid fa-list-ul"></i> Cartelera por Día
                </button>
                <button class="switch-btn" id="btnModeFlyers" onclick="setPublicDisplayMode('flyers')">
                    <i class="fa-solid fa-images"></i> Galería de Flyers (Grid Visual)
                </button>
            </div>

            <!-- MODO 1: CARTELERA POR DÍA -->
            <div id="listModeContainer">
                <div class="controls-section">
                    <div class="days-pills" id="daysPillsContainer"></div>
                    <div class="filter-pills">
                        <button class="pill-filter active" onclick="setFilter('tipo', 'todos')">Todas</button>
                        <button class="pill-filter" onclick="setFilter('tipo', 'A la gorra')">A la gorra</button>
                        <button class="pill-filter" onclick="s
